; Ucak Radar - ESP32-C3 + GC9A01 (LovyanGFX ile)
;
; Pin baglantisi (ESP32-C3 SuperMini icin):
;   GC9A01 SCL -> GPIO4   (PIN_SCLK)
;   GC9A01 SDA -> GPIO6   (PIN_MOSI)
;   GC9A01 CS  -> GPIO7   (PIN_CS)
;   GC9A01 DC  -> GPIO1   (PIN_DC)
;   GC9A01 RST -> GPIO0   (PIN_RST)
;   GC9A01 VCC -> 3V3, GND -> GND
; Farkli pin kullanacaksan asagidaki -DPIN_* degerlerini degistir.
; Renkler ters gorunurse LCD_INVERT degerini true <-> false cevir.

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB

extra_scripts = post:merge_bin.py

lib_deps =
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DPIN_SCLK=4
    -DPIN_MOSI=6
    -DPIN_CS=7
    -DPIN_DC=1
    -DPIN_RST=0
    -DLCD_INVERT=true
