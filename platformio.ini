; Ucak Radar - ESP32-C3 + GC9A01
;
; Pin baglantisi (ESP32-C3 SuperMini icin):
;   GC9A01 SCL -> GPIO4   (TFT_SCLK)
;   GC9A01 SDA -> GPIO6   (TFT_MOSI)
;   GC9A01 CS  -> GPIO7   (TFT_CS)
;   GC9A01 DC  -> GPIO1   (TFT_DC)
;   GC9A01 RST -> GPIO0   (TFT_RST)
;   GC9A01 VCC -> 3V3, GND -> GND
; Farkli pin kullanacaksan asagidaki -DTFT_* degerlerini degistir.
;
; Iki surum derlenir (TFT_eSPI'nin SPI port secimi ESP32-C3'te fark yaratir):
;   firmware_merged_esp32c3_vspi.bin  -> once bunu dene
;   firmware_merged_esp32c3_hspi.bin  -> o calismazsa bunu dene

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB

extra_scripts = post:merge_bin.py

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^7.2.0

[common]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI ayarlari (User_Setup.h kullanilmaz) ----
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=6
    -DTFT_SCLK=4
    -DTFT_CS=7
    -DTFT_DC=1
    -DTFT_RST=0
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000
    ; Renkler ters/yanlis gorunurse bunlardan birini ac:
    ; -DTFT_INVERSION_ON=1
    ; -DTFT_RGB_ORDER=TFT_BGR

[env:esp32c3_vspi]
build_flags =
    ${common.build_flags}
    -DUSE_VSPI_PORT=1

[env:esp32c3_hspi]
build_flags =
    ${common.build_flags}
    -DUSE_HSPI_PORT=1
